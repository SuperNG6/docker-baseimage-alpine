name: 检查并发布 Alpine s6 v3 镜像

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

concurrency:
  group: alpine-s6v3-publish
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    uses: SuperNG6/docker-baseimage-alpine/.github/workflows/build-s6v3.yml@v3
    secrets: inherit
