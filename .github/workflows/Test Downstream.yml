name: 测试 docker-aria2 s6 v2 兼容 s6 v3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile"
      - "install.sh"
      - "root/**"
      - ".github/scripts/test-base-contract.sh"
      - ".github/scripts/test-docker-aria2-s6v3-startup.sh"
      - ".github/workflows/Test Downstream.yml"
      - ".github/workflows/test-s6v3-candidate.yml"
      - ".github/workflows/build-s6v3.yml"
  push:
    branches:
      - v3
    paths:
      - "Dockerfile"
      - "install.sh"
      - "root/**"
      - ".github/scripts/test-base-contract.sh"
      - ".github/scripts/test-docker-aria2-s6v3-startup.sh"
      - ".github/workflows/Test Downstream.yml"
      - ".github/workflows/test-s6v3-candidate.yml"
      - ".github/workflows/build-s6v3.yml"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test-s6v3-candidate.yml
